<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Línea del agente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3f6f9; --card:#ffffff; --line:#e3e9ef; --fg:#1f2a37; --muted:#6b7a90; --accent:#19a7c4; --accent-soft:#e6f6fa; --ok:#22b573; --ok-soft:#e7f8f0; --warn:#d98a00; --warn-soft:#fff5e0; --bad:#e04848; --bad-soft:#fdeaea; --info:#19a7c4; --info-soft:#e6f6fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 Poppins, -apple-system, "Segoe UI", sans-serif; padding:24px; }
  h1 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 16px; color:var(--accent); font-weight:600; display:flex; align-items:center; gap:8px; }
  h1::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  h1 code { font-family:inherit; color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0; }
  .agent { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 22px; display:flex; gap:28px; align-items:center; flex-wrap:wrap; box-shadow:0 4px 18px rgba(31,42,55,.06); }
  .agent .big { font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .agent .label { font-size:11px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; font-weight:600; }
  .agent > div:last-child { text-transform:none; letter-spacing:0; font-weight:400; font-size:13px; margin-left:auto; }
  .pill { display:inline-block; padding:3px 12px; border-radius:999px; font-size:12px; font-weight:600; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .info { color:var(--info); } .muted { color:var(--muted); }
  .pill.ok { background:var(--ok-soft); } .pill.warn { background:var(--warn-soft); } .pill.bad { background:var(--bad-soft); } .pill.info { background:var(--info-soft); } .pill.muted { background:#eef2f6; }
  .warnbox { margin-top:12px; border:1px solid #f3d9a4; border-radius:12px; padding:12px 16px; color:#8a5a00; background:var(--warn-soft); }
  table { width:100%; border-collapse:separate; border-spacing:0; margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 4px 18px rgba(31,42,55,.06); }
  th, td { text-align:left; padding:12px 16px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:11px; letter-spacing:.08em; text-transform:uppercase; background:#f8fafc; }
  tr:last-child td { border-bottom:none; }
  tr.current td { background:var(--accent-soft); }
  td b { font-weight:600; }
  .foot { margin-top:14px; color:var(--muted); font-size:12px; display:flex; gap:24px; flex-wrap:wrap; }
  .empty { color:var(--muted); padding:24px; text-align:center; }
  @media (max-width:640px) { body { padding:16px; } .agent { gap:14px; } .agent > div:last-child { margin-left:0; } }
</style>
</head>
<body>
<h1>Telefonía en vivo <code>· actualiza cada segundo desde /state</code></h1>
<div id="app"><div class="empty">Cargando…</div></div>
<script>
const STATUS = { initiated:['info','iniciada'], ringing:['info','timbrando'], answered:['ok','en curso'], ended:['muted','terminada'] };
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function identity(leg) {
  if (leg.direction === 'outbound') return `<span class="info">${esc(leg.clientId)}</span> <span class="muted">${esc(leg.to)}</span>`;
  const id = leg.identity ?? { status:'pending' };
  if (id.status === 'resolved') return `<span class="info">${esc(id.clientId)}</span> <span class="muted">${esc(leg.from)}</span>`;
  if (id.status === 'ambiguous') return `<span class="bad">¿${id.candidates.map(esc).join(' o ')}?</span> <span class="muted">${esc(leg.from)} · lo decide el agente</span>`;
  if (id.status === 'unknown') return `<span class="warn">desconocido</span> <span class="muted">${esc(leg.from)}</span>`;
  return `<span class="muted">buscando… ${esc(leg.from)}</span>`;
}

function notes(leg) {
  const out = [];
  if (leg.endReason && leg.endReason !== 'hangup') out.push(`<span class="bad">${esc(leg.endReason)} ${esc(leg.sipMessage ?? '')}</span>`);
  if (leg.disposition === 'queued') out.push('<span class="warn">en cola: agente ocupado</span>');
  if (leg.disposition === 'offered') out.push('<span class="ok">ofrecida al agente</span>');
  if (leg.orphan) out.push('<span class="warn">llegó fuera de orden</span>');
  if (leg.reputationFlag) out.push(`<span class="warn">salió por línea quemada · usar ${esc(leg.reputationFlag.recommendedLine)}</span>`);
  return out.join('<br>') || '<span class="muted">–</span>';
}

function render(s) {
  const agents = Object.values(s.agents);
  const legs = Object.values(s.legs).sort((a, b) => (a.history[0]?.seq ?? 0) - (b.history[0]?.seq ?? 0));
  let html = '';
  if (agents.length === 0) html += '<div class="agent"><span class="muted">Sin línea de agente activa todavía. Envía <code>agent_leg.answered</code>.</span></div>';
  for (const a of agents) {
    const cur = a.currentLegId ? s.legs[a.currentLegId] : null;
    const w = (s.warnings ?? []).find((x) => x.agentId === a.id);
    html += `<div class="agent">
      <div><div class="label">LÍNEA DEL AGENTE</div><div class="big">${esc(a.id)} · ${esc(a.line)}</div></div>
      <div><span class="pill ${a.status === 'active' ? 'ok' : 'muted'}">${a.status === 'active' ? 'ACTIVA' : 'TERMINADA'}</span></div>
      <div>${cur ? `hablando con <b class="info">${esc(cur.id)}</b> (${esc(cur.clientId ?? cur.from)})` : '<span class="muted">libre, esperando siguiente cliente</span>'}</div>
      <div class="muted">${a.legIds.length} cliente(s) han pasado por esta línea</div>
    </div>`;
    if (w) html += `<div class="warnbox">⚠ Línea ${esc(w.line)} marcada <b>${esc(w.label)}</b> · ${w.calls24h} llamadas/24h · recomendada: <b>${esc(w.recommendedLine ?? 'ninguna limpia')}</b><br><span style="opacity:.8">${esc(w.advice)}</span></div>`;
  }
  html += `<table><thead><tr><th>Llamada</th><th>Dirección</th><th>Cliente</th><th>Estado</th><th>Notas</th></tr></thead><tbody>`;
  if (legs.length === 0) html += '<tr><td colspan="5" class="empty">Todavía no hay clientes.</td></tr>';
  for (const l of legs) {
    const [cls, label] = STATUS[l.status] ?? ['muted', l.status];
    const isCur = agents.some((a) => a.currentLegId === l.id);
    html += `<tr class="${isCur ? 'current' : ''}"><td><b>${esc(l.id)}</b></td><td>${l.direction === 'inbound' ? '⬇ inbound' : '⬆ outbound'}</td><td>${identity(l)}</td><td><span class="pill ${cls}">${label}</span></td><td>${notes(l)}</td></tr>`;
  }
  html += '</tbody></table>';
  html += `<div class="foot"><span>último seq: ${s.lastSeq}</span><span>aplicados: ${s.counters.applied}</span><span>ignorados (duplicados/desorden): ${s.counters.ignored}</span><span>llamadas desde línea quemada: ${s.counters.dialsFromBurnedLine}</span></div>`;
  document.getElementById('app').innerHTML = html;
}

async function tick() {
  try { render(await (await fetch('/state')).json()); } catch { document.getElementById('app').innerHTML = '<div class="empty bad">Servidor no responde</div>'; }
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
